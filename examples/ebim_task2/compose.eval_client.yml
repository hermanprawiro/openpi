# Run the eval client on the sim machine (host networking for FastDDS).
# The policy server may be local or remote:
#   POLICY_SERVER_HOST=192.168.x.y docker compose -f examples/ebim_task2/compose.eval_client.yml run --rm eval_client
# Extra CLI flags via EVAL_ARGS:
#   EVAL_ARGS="--num-episodes 1 --no-async-inference" docker compose ... run --rm eval_client
services:
  eval_client:
    build:
      context: ../..
      dockerfile: examples/ebim_task2/Dockerfile.eval_client
    image: ebim-task2-eval-client
    network_mode: host
    ipc: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      # Values come from the shell env or examples/ebim_task2/.env
      # (docker compose loads the .env next to this file automatically).
      - POLICY_SERVER_HOST=${POLICY_SERVER_HOST:-localhost}
      - POLICY_SERVER_PORT=${POLICY_SERVER_PORT:-8000}
      - POLICY_SERVER_API_KEY=${POLICY_SERVER_API_KEY:-}
      - HOME=/tmp  # host uid has no passwd entry in the container
    volumes:
      - ./eval_results:/opt/eval_client/eval_results
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec python3 -m eval_client.main --config eval_config.yaml ${EVAL_ARGS:-}"
