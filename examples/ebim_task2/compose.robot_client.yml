# Real-robot client (ROS 2 Humble, Fast DDS, host network). Run from the openpi repo root:
#   docker compose -f examples/ebim_task2/compose.robot_client.yml build
#   POLICY_SERVER_HOST=<gpu host> docker compose -f examples/ebim_task2/compose.robot_client.yml \
#       run --rm robot-client check-obs
# Any robot_client subcommand works the same way (check-infer, check-motion --arm right, prepare,
# run --dry-run, run, release); `bash`, `pytest ...` and `ros2 ...` run as given.
#
# The site YAML is mounted at /config/robot_site.yaml; to use another one, change the left side of that
# volume (or override keys with `--set key=value`). Run directories land in ${OUT_DIR:-./robot_runs}
# (next to this file).
#
# ROS_DOMAIN_ID is passed through (default 0, the Munich robot's); it must equal ros.domain_id of the site YAML
# (the client refuses motion commands otherwise): ROS_DOMAIN_ID=7 docker compose ... run --rm robot-client ...
#
# Fast DDS uses the shipped UDP-only profile (/app/robot_client/fastdds_udp_only.xml) by default, like the
# Munich hosts. Set FASTRTPS_DEFAULT_PROFILES_FILE to another path in the container to replace it, or to
# the empty string (FASTRTPS_DEFAULT_PROFILES_FILE= docker compose ...) for Fast DDS's built-in transports.
#
# Tests (two invocations: the suites share test module and conftest basenames):
#   docker compose -f examples/ebim_task2/compose.robot_client.yml run --rm robot-client pytest /app/robot_client/tests
#   docker compose -f examples/ebim_task2/compose.robot_client.yml run --rm robot-client pytest /app/eval_client/tests
#
# Dev setup without a robot (profile `dev`; separate containers, so they use the UDP-only profile):
#   docker compose -f examples/ebim_task2/compose.robot_client.yml --profile dev up -d fake-robot stub-server
#   docker compose -f examples/ebim_task2/compose.robot_client.yml run --rm robot-client check-obs
#   docker compose -f examples/ebim_task2/compose.robot_client.yml --profile dev down
#
# Viewer (optional, profile `viewer`; README_ROBOT_CLIENT.md section 12): a read-only web page over ${OUT_DIR}
# (mounted read-only; it never talks to ROS or the policy server). Start it next to a client command and open
# http://localhost:8765 (VIEWER_PORT changes the port, VIEWER_HOST=0.0.0.0 makes it reachable from other machines):
#   docker compose -f examples/ebim_task2/compose.robot_client.yml --profile viewer up -d viewer
#   docker compose -f examples/ebim_task2/compose.robot_client.yml --profile viewer stop viewer
# Stop it with `stop viewer`, never `down`: `down` can also stop and remove a running robot-client container.

x-robot-client-image: &robot-client-image
  build:
    context: ../..
    dockerfile: examples/ebim_task2/Dockerfile.robot_client
  image: ebim-task2-robot-client

services:
  robot-client:
    <<: *robot-client-image
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      - POLICY_SERVER_HOST=${POLICY_SERVER_HOST:-}
      - POLICY_SERVER_PORT=${POLICY_SERVER_PORT:-}
      - POLICY_SERVER_API_KEY=${POLICY_SERVER_API_KEY:-}
      - ROBOT_SITE=/config/robot_site.yaml
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=${FASTRTPS_DEFAULT_PROFILES_FILE-/app/robot_client/fastdds_udp_only.xml}
    volumes:
      - ./robot_client/robot_site.munich.yaml:/config/robot_site.yaml:ro
      - ${OUT_DIR:-./robot_runs}:/out

  fake-robot:
    <<: *robot-client-image
    profiles: [dev]
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/app/robot_client/fastdds_udp_only.xml
    volumes:
      - ./robot_client/robot_site.munich.yaml:/config/robot_site.yaml:ro
      - ${OUT_DIR:-./robot_runs}:/out
    command: python3 -m robot_client.fake_robot --site /config/robot_site.yaml --events /out/fake_robot_events.jsonl

  stub-server:
    <<: *robot-client-image
    profiles: [dev]
    network_mode: host
    environment:
      - FASTRTPS_DEFAULT_PROFILES_FILE=/app/robot_client/fastdds_udp_only.xml
    command: python3 -m robot_client.stub_server --port ${POLICY_SERVER_PORT:-8000}

  viewer:
    <<: *robot-client-image
    profiles: [viewer]
    network_mode: host
    volumes:
      - ${OUT_DIR:-./robot_runs}:/out:ro
    stop_signal: SIGINT  # the viewer is PID 1: SIGINT (Ctrl-C) stops it at once; SIGTERM would wait for the 10 s kill
    command: python3 -m robot_client.viewer --runs /out --host ${VIEWER_HOST:-127.0.0.1} --port ${VIEWER_PORT:-8765}
